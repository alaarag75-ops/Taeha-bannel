<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taeha Panel | منصة الأكواد والمطورين</title>
    
    <!-- CSS & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0d1117; color: #c9d1d9; }
        .glass { background: rgba(22, 27, 34, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .dev-glass { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(16px); border: 1px solid rgba(239, 68, 68, 0.4); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 select-none">

    <!-- Header Navigation -->
    <header class="w-full max-w-5xl mx-auto glass rounded-2xl p-3.5 flex justify-between items-center z-10 shadow-2xl">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white text-xl font-bold shadow-lg">
                <i class="fa-solid fa-code"></i>
            </div>
            <div>
                <h1 class="font-black text-base text-white">Taeha Panel</h1>
                <p class="text-xs text-blue-400 font-bold" id="userDisplay">غير مسجل الدخول</p>
            </div>
        </div>

        <div class="flex gap-2">
            <button id="profileBtn" onclick="openProfileModal()" class="hidden bg-gray-800 hover:bg-gray-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
                <i class="fa-solid fa-user-pen"></i> الملف الشخصي
            </button>
            <button onclick="openDevAuth()" class="bg-red-600/20 hover:bg-red-600/40 text-red-400 border border-red-500/40 px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
                <i class="fa-solid fa-shield-halved"></i> لوحة المطور
            </button>
            <button id="logoutBtn" onclick="logout()" class="hidden bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-xl text-xs font-bold">خروج</button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="w-full max-w-5xl mx-auto my-4 flex-1 flex flex-col items-center">
        
        <!-- Auth Screen -->
        <div id="authScreen" class="w-full max-w-sm glass rounded-3xl p-6 shadow-2xl space-y-4 text-center my-auto border border-blue-500/30">
            <div class="w-16 h-16 mx-auto rounded-2xl bg-blue-600/20 text-blue-400 border border-blue-500/40 flex items-center justify-center text-3xl">
                <i class="fa-solid fa-terminal"></i>
            </div>
            <h2 class="text-xl font-black text-white">تسجيل الدخول | Taeha Panel</h2>
            <p class="text-xs text-gray-400">ادخل اسمك للانضمام لمجتمع مشاركة الأكواد</p>

            <input type="text" id="usernameInput" placeholder="اسم المستخدم" class="w-full bg-[#0d1117] border border-gray-700 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-blue-500">
            <input type="password" id="passwordInput" placeholder="كلمة المرور" class="w-full bg-[#0d1117] border border-gray-700 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-blue-500">

            <button onclick="loginPlayer()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-extrabold py-3 rounded-xl text-xs shadow-lg transition">
                دخول المنصة
            </button>
        </div>

        <!-- Dashboard Content (Posts & Codes Stream) -->
        <div id="panelContent" class="w-full hidden space-y-4">
            
            <!-- Create Post Box -->
            <div class="glass rounded-2xl p-4 border border-gray-800 space-y-3">
                <h3 class="text-xs font-bold text-gray-300 flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-blue-400"></i> نشر كود أو مشروع جديد:
                </h3>
                <input type="text" id="postTitle" placeholder="عنوان الكود / المشروع" class="w-full bg-[#0d1117] border border-gray-700 rounded-xl p-2.5 text-xs focus:outline-none focus:border-blue-500">
                <textarea id="postCode" rows="4" placeholder="ضع الكود هنا..." class="w-full bg-[#0d1117] border border-gray-700 rounded-xl p-2.5 text-xs font-mono focus:outline-none focus:border-blue-500"></textarea>
                <button onclick="createPost()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-xl text-xs font-bold transition">
                    نشر الكود 🚀
                </button>
            </div>

            <!-- Feed Stream -->
            <div class="space-y-3" id="postsFeed"></div>
        </div>

    </main>

    <!-- Profile Edit Modal -->
    <div id="profileModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-[#161b22] border border-gray-800 rounded-3xl p-6 max-w-sm w-full space-y-4 text-center">
            <h3 class="text-base font-bold text-white">تعديل الملف الشخصي</h3>
            <div class="relative w-20 h-20 mx-auto">
                <img id="profileAvatarPreview" src="https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=200&auto=format&fit=crop" class="w-full h-full rounded-full object-cover border-2 border-blue-500">
            </div>
            <input type="text" id="avatarUrlInput" placeholder="رابط صورة الملف الشخصي (URL)" class="w-full bg-[#0d1117] border border-gray-700 rounded-xl p-2.5 text-xs focus:outline-none">
            <textarea id="bioInput" rows="2" placeholder="النبذة التعريفية (Bio)" class="w-full bg-[#0d1117] border border-gray-700 rounded-xl p-2.5 text-xs focus:outline-none"></textarea>
            <div class="flex gap-2">
                <button onclick="closeProfileModal()" class="w-1/2 bg-gray-800 text-gray-300 py-2 rounded-xl text-xs font-bold">إلغاء</button>
                <button onclick="saveProfile()" class="w-1/2 bg-blue-600 hover:bg-blue-500 text-white py-2 rounded-xl text-xs font-bold">حفظ التغيرات</button>
            </div>
        </div>
    </div>

    <!-- Dev Auth Password Modal -->
    <div id="devAuthModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-[#161b22] border border-red-500/40 rounded-2xl p-6 max-w-sm w-full text-center space-y-4">
            <i class="fa-solid fa-shield-halved text-red-500 text-4xl mb-2"></i>
            <h3 class="text-base font-bold text-white">دخول المطورين (TAEHADEV)</h3>
            <input type="password" id="devKeyInput" placeholder="DEV KEY" class="w-full bg-black border border-red-500/30 rounded-xl p-2.5 text-center font-mono text-red-400 uppercase font-bold text-xs focus:outline-none">
            <div class="flex gap-2">
                <button onclick="closeDevAuth()" class="w-1/2 bg-gray-800 text-gray-300 py-2 rounded-xl text-xs font-bold">إلغاء</button>
                <button onclick="verifyDev()" class="w-1/2 bg-red-600 hover:bg-red-500 text-white py-2 rounded-xl text-xs font-bold">تأكيد الدخول</button>
            </div>
        </div>
    </div>

    <!-- Developer Dashboard Control Panel -->
    <div id="devDashboard" class="hidden fixed inset-0 bg-black/95 backdrop-blur-xl flex items-center justify-center p-4 z-50">
        <div class="dev-glass rounded-3xl p-6 max-w-4xl w-full h-[85vh] flex flex-col space-y-4">
            <div class="flex justify-between items-center border-b border-red-500/20 pb-3">
                <div class="flex items-center gap-2 text-red-400 font-bold text-base">
                    <i class="fa-solid fa-user-shield"></i> لوحة إدارة المطورين | Taeha Panel
                </div>
                <button onclick="closeDevDash()" class="text-gray-400 hover:text-white text-2xl"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="flex-1 overflow-y-auto space-y-3 pr-1" id="devUsersList">
                <!-- User verification & controls generated here -->
            </div>
        </div>
    </div>

    <!-- JS Logic -->
    <script>
        const DEV_KEY = "TAEHADEV"; // كود المطور الخاص بك

        let users = JSON.parse(localStorage.getItem('taeha_users') || "{}");
        let posts = JSON.parse(localStorage.getItem('taeha_posts') || "[]");
        let bannedUsers = JSON.parse(localStorage.getItem('taeha_banned') || "[]");
        let currentUser = null;

        function loginPlayer() {
            const user = document.getElementById('usernameInput').value.trim();
            if (!user) return alert('أدخل اسم المستخدم!');

            if (bannedUsers.includes(user)) {
                return alert('⚠️ هذا الحساب مطرود ومحظور من قِبل المطور!');
            }

            currentUser = user;
            if (!users[user]) {
                users[user] = {
                    isVerified: false,
                    avatar: 'https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=200&auto=format&fit=crop',
                    bio: 'مطور في Taeha Panel'
                };
                saveState();
            }

            updateUserDisplay();
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('panelContent').classList.remove('hidden');
            document.getElementById('profileBtn').classList.remove('hidden');
            document.getElementById('logoutBtn').classList.remove('hidden');

            renderPosts();
        }

        function logout() { location.reload(); }

        function updateUserDisplay() {
            const isVer = users[currentUser]?.isVerified;
            document.getElementById('userDisplay').innerHTML = `
                ${currentUser} ${isVer ? '<i class="fa-solid fa-circle-check text-blue-400 ml-1" title="مطور موثق"></i>' : ''}
            `;
        }

        function createPost() {
            const title = document.getElementById('postTitle').value.trim();
            const code = document.getElementById('postCode').value.trim();

            if (!title || !code) return alert('يرجى ملء العنوان والكود!');

            posts.unshift({
                id: Date.now(),
                author: currentUser,
                title: title,
                code: code,
                date: new Date().toLocaleTimeString('ar-EG')
            });

            document.getElementById('postTitle').value = '';
            document.getElementById('postCode').value = '';
            saveState();
            renderPosts();
        }

        function renderPosts() {
            const feed = document.getElementById('postsFeed');
            if (posts.length === 0) {
                feed.innerHTML = `<p class="text-center text-gray-500 text-xs py-8">لا توجد أكواد منشورات بعد...</p>`;
                return;
            }

            feed.innerHTML = posts.map(p => {
                const u = users[p.author] || {};
                return `
                    <div class="glass rounded-2xl p-4 border border-gray-800 space-y-3">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-2.5">
                                <img src="${u.avatar}" class="w-8 h-8 rounded-full object-cover">
                                <div>
                                    <span class="text-xs font-bold text-white flex items-center gap-1">
                                        ${p.author}
                                        ${u.isVerified ? '<i class="fa-solid fa-circle-check text-blue-400"></i>' : ''}
                                    </span>
                                    <p class="text-[10px] text-gray-500">${p.date}</p>
                                </div>
                            </div>
                        </div>
                        <h4 class="text-xs font-bold text-blue-400">${p.title}</h4>
                        <pre class="bg-black/60 p-3 rounded-xl font-mono text-xs text-emerald-400 overflow-x-auto border border-gray-800">${escapeHtml(p.code)}</pre>
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Profile Modal Logic
        function openProfileModal() {
            document.getElementById('profileModal').classList.remove('hidden');
            document.getElementById('avatarUrlInput').value = users[currentUser].avatar;
            document.getElementById('bioInput').value = users[currentUser].bio;
        }
        function closeProfileModal() { document.getElementById('profileModal').classList.add('hidden'); }

        function saveProfile() {
            const url = document.getElementById('avatarUrlInput').value.trim();
            const bio = document.getElementById('bioInput').value.trim();

            if (url) users[currentUser].avatar = url;
            if (bio) users[currentUser].bio = bio;

            saveState();
            closeProfileModal();
            renderPosts();
        }

        // Dev Controls
        function openDevAuth() { document.getElementById('devAuthModal').classList.remove('hidden'); }
        function closeDevAuth() { document.getElementById('devAuthModal').classList.add('hidden'); }

        function verifyDev() {
            const input = document.getElementById('devKeyInput').value.trim();
            if (input === DEV_KEY) {
                closeDevAuth();
                openDevDash();
            } else {
                alert('كود المطور غير صحيح!');
            }
        }

        function openDevDash() {
            document.getElementById('devDashboard').classList.remove('hidden');
            renderDevUsers();
        }

        function closeDevDash() { document.getElementById('devDashboard').classList.add('hidden'); }

        function toggleVerify(username) {
            users[username].isVerified = !users[username].isVerified;
            saveState();
            renderDevUsers();
            if (currentUser === username) updateUserDisplay();
            renderPosts();
        }

        function kickUser(username) {
            if (confirm(`هل أنت متأكد من طرد وتأطير الحساب "${username}"؟`)) {
                bannedUsers.push(username);
                saveState();
                renderDevUsers();
                if (currentUser === username) location.reload();
            }
        }

        function renderDevUsers() {
            const container = document.getElementById('devUsersList');
            const allUsers = Object.keys(users);

            container.innerHTML = allUsers.map(u => `
                <div class="p-3 bg-[#0d1117] rounded-xl border border-gray-800 flex justify-between items-center text-xs">
                    <div class="flex items-center gap-2">
                        <img src="${users[u].avatar}" class="w-7 h-7 rounded-full object-cover">
                        <span class="font-bold text-white">${u}</span>
                        ${users[u].isVerified ? '<span class="text-blue-400 font-bold">(موثق <i class="fa-solid fa-circle-check"></i>)</span>' : ''}
                    </div>
                    <div class="flex gap-2">
                        <button onclick="toggleVerify('${u}')" class="bg-blue-600/20 hover:bg-blue-600 text-blue-400 hover:text-white px-2.5 py-1 rounded-lg border border-blue-500/40">
                            ${users[u].isVerified ? 'إزالة التوثيق' : 'منح العلامة الزرقاء 💙'}
                        </button>
                        <button onclick="kickUser('${u}')" class="bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white px-2.5 py-1 rounded-lg border border-red-500/40">
                            طرد (Kick)
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function saveState() {
            localStorage.setItem('taeha_users', JSON.stringify(users));
            localStorage.setItem('taeha_posts', JSON.stringify(posts));
            localStorage.setItem('taeha_banned', JSON.stringify(bannedUsers));
        }
    </script>
</body>
</html>
