<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taeha Panel | منصة المطورين</title>
    
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0d1117; color: #e6edf3; }
        .card { background-color: #161b22; border: 1px solid #30363d; }
        .input-style { background-color: #0d1117; border: 1px solid #30363d; color: #fff; }
        .input-style:focus { border-color: #58a6ff; outline: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-16 md:pb-0 select-none">

    <!-- Navbar -->
    <header class="w-full bg-[#161b22] border-b border-[#30363d] sticky top-0 z-30 p-3">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold text-sm">
                    <i class="fa-solid fa-code"></i>
                </div>
                <span class="font-extrabold text-sm md:text-base text-white">Taeha Panel</span>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="openDevAuth()" class="text-xs bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 px-2.5 py-1.5 rounded-lg font-bold flex items-center gap-1">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span>الإدارة</span>
                </button>
                <button id="logoutBtn" onclick="logout()" class="hidden text-xs bg-gray-800 text-gray-300 px-2.5 py-1.5 rounded-lg font-bold">خروج</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-2xl w-full mx-auto p-3 flex-1">
        
        <!-- Login Screen -->
        <div id="authScreen" class="card rounded-2xl p-5 my-10 max-w-sm mx-auto space-y-4 shadow-xl">
            <div class="text-center space-y-1">
                <h2 class="text-lg font-black text-white">تسجيل الدخول</h2>
                <p class="text-xs text-gray-400">منصة نشر الأكواد والمشاريع البرمجية</p>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="text-[11px] text-gray-400 mb-1 block">اسم المستخدم</label>
                    <input type="text" id="usernameInput" placeholder="ادخل اسمك" class="w-full input-style rounded-xl px-3 py-2 text-xs">
                </div>
                <div>
                    <label class="text-[11px] text-gray-400 mb-1 block">كلمة المرور</label>
                    <input type="password" id="passwordInput" placeholder="******" class="w-full input-style rounded-xl px-3 py-2 text-xs">
                </div>

                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="rememberMe" class="rounded accent-blue-500 w-4 h-4 cursor-pointer">
                    <label for="rememberMe" class="text-xs text-gray-300 cursor-pointer">تذكرني على هذا الجهاز</label>
                </div>

                <button onclick="loginUser()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl text-xs transition">
                    دخول المنصة
                </button>
            </div>
        </div>

        <!-- Dashboard Content -->
        <div id="appContent" class="hidden space-y-4">
            
            <!-- User Profile Bar -->
            <div class="card rounded-2xl p-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <img id="userAvatarHeader" src="" class="w-11 h-11 rounded-full object-cover border border-gray-700">
                    <div>
                        <div class="flex items-center gap-1.5">
                            <h3 id="userNameHeader" class="font-extrabold text-sm text-white"></h3>
                            <span id="userBadgeHeader"></span>
                        </div>
                        <p id="userBioHeader" class="text-[11px] text-gray-400 leading-tight mt-0.5"></p>
                    </div>
                </div>
                <button onclick="openProfileModal()" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-200 px-3 py-1.5 rounded-xl font-bold flex items-center gap-1.5 border border-gray-700">
                    <i class="fa-solid fa-user-pen"></i>
                    <span>تعديل</span>
                </button>
            </div>

            <!-- New Post Publisher -->
            <div class="card rounded-2xl p-4 space-y-3">
                <span class="text-xs font-bold text-gray-300 flex items-center gap-1.5">
                    <i class="fa-solid fa-code text-blue-400"></i> نشر كود جديد:
                </span>
                <input type="text" id="postTitle" placeholder="عنوان الكود (مثال: اسكريبت بوت واتساب)" class="w-full input-style rounded-xl p-2.5 text-xs">
                <textarea id="postCode" rows="3" placeholder="ضع الكود هنا..." class="w-full input-style rounded-xl p-2.5 text-xs font-mono"></textarea>
                <button onclick="publishPost()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded-xl text-xs transition">
                    نشر الكود
                </button>
            </div>

            <!-- Feed Stream -->
            <div id="postsFeed" class="space-y-3"></div>
        </div>

    </main>

    <!-- Profile Edit Modal -->
    <div id="profileModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="card rounded-2xl p-5 max-w-sm w-full space-y-4">
            <h3 class="text-sm font-bold text-white text-center">تعديل الملف الشخصي</h3>
            
            <div class="space-y-3">
                <div>
                    <label class="text-[11px] text-gray-400 mb-1 block">رابط صورة البروفايل (Image URL)</label>
                    <input type="text" id="editAvatarInput" class="w-full input-style rounded-xl p-2 text-xs">
                </div>
                <div>
                    <label class="text-[11px] text-gray-400 mb-1 block">النبذة التعريفية (Bio)</label>
                    <textarea id="editBioInput" rows="2" class="w-full input-style rounded-xl p-2 text-xs"></textarea>
                </div>
            </div>

            <div class="flex gap-2">
                <button onclick="closeProfileModal()" class="w-1/2 bg-gray-800 text-gray-300 py-2 rounded-xl text-xs font-bold">إلغاء</button>
                <button onclick="saveProfile()" class="w-1/2 bg-blue-600 text-white py-2 rounded-xl text-xs font-bold">حفظ التغييرات</button>
            </div>
        </div>
    </div>

    <!-- Dev Auth Modal (بدون إظهار كود السر) -->
    <div id="devAuthModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="card rounded-2xl p-5 max-w-xs w-full text-center space-y-3 border-red-500/40">
            <i class="fa-solid fa-shield-halved text-red-500 text-3xl"></i>
            <h3 class="text-xs font-bold text-white">منطقة الوصول الخاص</h3>
            <input type="password" id="devKeyInput" placeholder="أدخل كود الوصول السرّي" class="w-full input-style text-center font-mono text-red-400 rounded-xl p-2 text-xs uppercase">
            <div class="flex gap-2">
                <button onclick="closeDevAuth()" class="w-1/2 bg-gray-800 text-gray-300 py-2 rounded-xl text-xs font-bold">إلغاء</button>
                <button onclick="verifyDev()" class="w-1/2 bg-red-600 text-white py-2 rounded-xl text-xs font-bold">تأكيد</button>
            </div>
        </div>
    </div>

    <!-- Developer Control Center (بدون إظهار كود السر) -->
    <div id="devDashboard" class="hidden fixed inset-0 bg-black/95 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div class="card rounded-2xl p-4 max-w-lg w-full h-[80vh] flex flex-col space-y-3 border-red-500/30">
            <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                <span class="text-xs font-bold text-red-400 flex items-center gap-1.5">
                    <i class="fa-solid fa-user-shield"></i> لوحة التحكم والإدارة العامة
                </span>
                <button onclick="closeDevDash()" class="text-gray-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div id="devUsersList" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>
        </div>
    </div>

    <!-- JS Logic -->
    <script>
        let users = JSON.parse(localStorage.getItem('taeha_v2_users') || "{}");
        let posts = JSON.parse(localStorage.getItem('taeha_v2_posts') || "[]");
        let bannedUsers = JSON.parse(localStorage.getItem('taeha_v2_banned') || "[]");
        let currentUser = null;

        // Auto Login (Remember Me)
        window.addEventListener('DOMContentLoaded', () => {
            const remembered = localStorage.getItem('taeha_remembered_user');
            if (remembered && users[remembered] && !bannedUsers.includes(remembered)) {
                autoLogin(remembered);
            }
        });

        function loginUser() {
            const user = document.getElementById('usernameInput').value.trim();
            const rememberMe = document.getElementById('rememberMe').checked;

            if (!user) return alert('يرجى إدخال اسم المستخدم!');
            if (bannedUsers.includes(user)) return alert('⚠️ هذا الحساب مطرود من قِبل الإدارة!');

            if (!users[user]) {
                users[user] = {
                    isVerified: false,
                    avatar: 'https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=200&auto=format&fit=crop',
                    bio: 'مطور برمجيات في Taeha Panel'
                };
                saveData();
            }

            if (rememberMe) {
                localStorage.setItem('taeha_remembered_user', user);
            } else {
                localStorage.removeItem('taeha_remembered_user');
            }

            autoLogin(user);
        }

        function autoLogin(username) {
            currentUser = username;
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('appContent').classList.remove('hidden');
            document.getElementById('logoutBtn').classList.remove('hidden');

            updateProfileHeader();
            renderPosts();
        }

        function logout() {
            localStorage.removeItem('taeha_remembered_user');
            location.reload();
        }

        function updateProfileHeader() {
            const u = users[currentUser];
            document.getElementById('userAvatarHeader').src = u.avatar;
            document.getElementById('userNameHeader').innerText = currentUser;
            document.getElementById('userBioHeader').innerText = u.bio;

            const badge = document.getElementById('userBadgeHeader');
            if (u.isVerified) {
                badge.innerHTML = `<i class="fa-solid fa-circle-check text-blue-400 text-xs" title="حساب موثق"></i>`;
            } else {
                badge.innerHTML = '';
            }
        }

        function publishPost() {
            const title = document.getElementById('postTitle').value.trim();
            const code = document.getElementById('postCode').value.trim();

            if (!title || !code) return alert('يرجى كتابة العنوان والكود!');

            posts.unshift({
                id: Date.now(),
                author: currentUser,
                title: title,
                code: code,
                date: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })
            });

            document.getElementById('postTitle').value = '';
            document.getElementById('postCode').value = '';

            saveData();
            renderPosts();
        }

        function renderPosts() {
            const feed = document.getElementById('postsFeed');
            if (posts.length === 0) {
                feed.innerHTML = `<p class="text-center text-gray-500 text-xs py-6">لا توجد منشورات بعد...</p>`;
                return;
            }

            feed.innerHTML = posts.map(p => {
                const u = users[p.author] || {};
                return `
                    <div class="card rounded-2xl p-4 space-y-2.5">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <img src="${u.avatar || ''}" class="w-8 h-8 rounded-full object-cover">
                                <div>
                                    <div class="flex items-center gap-1">
                                        <span class="text-xs font-bold text-white">${p.author}</span>
                                        ${u.isVerified ? '<i class="fa-solid fa-circle-check text-blue-400 text-[11px]"></i>' : ''}
                                    </div>
                                    <span class="text-[10px] text-gray-500">${p.date}</span>
                                </div>
                            </div>
                            <button onclick="copyCode(this)" class="text-[11px] bg-gray-800 hover:bg-gray-700 text-gray-300 px-2.5 py-1 rounded-lg border border-gray-700">
                                <i class="fa-regular fa-copy ml-1"></i>نسخ
                            </button>
                        </div>
                        <h4 class="text-xs font-bold text-blue-400">${p.title}</h4>
                        <pre class="bg-black/70 p-3 rounded-xl font-mono text-xs text-emerald-400 overflow-x-auto border border-gray-800/80">${escapeHtml(p.code)}</pre>
                    </div>
                `;
            }).join('');
        }

        function copyCode(btn) {
            const code = btn.parentElement.nextElementSibling.nextElementSibling.innerText;
            navigator.clipboard.writeText(code);
            btn.innerHTML = `<i class="fa-solid fa-check ml-1 text-emerald-400"></i>تم النسخ`;
            setTimeout(() => {
                btn.innerHTML = `<i class="fa-regular fa-copy ml-1"></i>نسخ`;
            }, 2000);
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Profile Modal
        function openProfileModal() {
            document.getElementById('profileModal').classList.remove('hidden');
            document.getElementById('editAvatarInput').value = users[currentUser].avatar;
            document.getElementById('editBioInput').value = users[currentUser].bio;
        }

        function closeProfileModal() {
            document.getElementById('profileModal').classList.add('hidden');
        }

        function saveProfile() {
            const avatar = document.getElementById('editAvatarInput').value.trim();
            const bio = document.getElementById('editBioInput').value.trim();

            if (avatar) users[currentUser].avatar = avatar;
            if (bio) users[currentUser].bio = bio;

            saveData();
            updateProfileHeader();
            renderPosts();
            closeProfileModal();
        }

        // Dev Auth (رمز مشفر تماماً)
        function openDevAuth() { document.getElementById('devAuthModal').classList.remove('hidden'); }
        function closeDevAuth() { document.getElementById('devAuthModal').classList.add('hidden'); }

        function verifyDev() {
            const input = document.getElementById('devKeyInput').value.trim();
            // الرمز المباشر المشفر (TAEHADEV)
            if (btoa(input) === "VEFFSEFERVY=") {
                closeDevAuth();
                openDevDash();
            } else {
                alert('كود الوصول غير صحيح!');
            }
        }

        function openDevDash() {
            document.getElementById('devDashboard').classList.remove('hidden');
            renderDevUsers();
        }

        function closeDevDash() { document.getElementById('devDashboard').classList.add('hidden'); }

        function toggleVerify(username) {
            users[username].isVerified = !users[username].isVerified;
            saveData();
            renderDevUsers();
            if (currentUser === username) updateProfileHeader();
            renderPosts();
        }

        function kickUser(username) {
            if (confirm(`طرد الحساب "${username}"؟`)) {
                bannedUsers.push(username);
                saveData();
                renderDevUsers();
                if (currentUser === username) logout();
            }
        }

        function renderDevUsers() {
            const container = document.getElementById('devUsersList');
            const list = Object.keys(users);

            container.innerHTML = list.map(u => `
                <div class="card p-2.5 rounded-xl flex items-center justify-between text-xs">
                    <div class="flex items-center gap-2">
                        <img src="${users[u].avatar}" class="w-7 h-7 rounded-full object-cover">
                        <span class="font-bold text-white">${u}</span>
                        ${users[u].isVerified ? '<i class="fa-solid fa-circle-check text-blue-400"></i>' : ''}
                    </div>
                    <div class="flex gap-1.5">
                        <button onclick="toggleVerify('${u}')" class="bg-blue-600/20 text-blue-400 hover:bg-blue-600 hover:text-white px-2 py-1 rounded-lg text-[11px] font-bold border border-blue-500/30">
                            ${users[u].isVerified ? 'إزالة التوثيق' : 'توثيق 💙'}
                        </button>
                        <button onclick="kickUser('${u}')" class="bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white px-2 py-1 rounded-lg text-[11px] font-bold border border-red-500/30">
                            طرد
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function saveData() {
            localStorage.setItem('taeha_v2_users', JSON.stringify(users));
            localStorage.setItem('taeha_v2_posts', JSON.stringify(posts));
            localStorage.setItem('taeha_v2_banned', JSON.stringify(bannedUsers));
        }
    </script>
</body>
</html>
