<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taeha Panel | منصة المطورين</title>
    
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* الثيم الداكن (Dark Mode) */
        body.dark-mode {
            background-color: #060913;
            color: #f1f5f9;
        }
        body.dark-mode .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        body.dark-mode .input-style {
            background-color: rgba(10, 15, 30, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        /* الثيم الفاتح (Light Mode) */
        body.light-mode {
            background-color: #f8fafc;
            color: #0f172a;
        }
        body.light-mode .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 0, 0, 0.1);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        body.light-mode .input-style {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #0f172a;
        }
        body.light-mode .text-white { color: #0f172a !important; }
        body.light-mode .text-gray-400 { color: #64748b !important; }

        .input-style:focus {
            border-color: #3b82f6;
            outline: none;
        }

        /* خلفية الفيديو العامة والمتحركة */
        .global-video-bg, .dev-video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
            opacity: 0.25;
            pointer-events: none;
        }
        .dev-video-bg {
            position: absolute;
            z-index: 0;
            opacity: 0.35;
        }
    </style>
</head>
<body class="dark-mode min-h-screen flex flex-col justify-between pb-16 md:pb-0 select-none relative">

    <!-- فيديو الخلفية العام (يتم التحكم فيه من الإعدادات) -->
    <video id="bgGlobalVideo" class="global-video-bg hidden" autoplay loop muted playsinline>
        <source src="https://files.catbox.moe/dglmga.mp4" type="video/mp4">
    </video>

    <!-- Navbar -->
    <header class="w-full glass-card sticky top-0 z-30 p-3 border-b">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white font-black shadow-lg">
                    <i class="fa-solid fa-code"></i>
                </div>
                <span class="font-black text-base text-white tracking-wide">Taeha Panel</span>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="openSettingsModal()" class="text-xs bg-gray-800/60 hover:bg-gray-700 text-gray-200 p-2 rounded-xl border border-white/10 transition" title="الإعدادات">
                    <i class="fa-solid fa-gear text-sm"></i>
                </button>
                <button onclick="openDevAuth()" class="text-xs bg-red-500/15 hover:bg-red-500/30 text-red-400 border border-red-500/40 px-3 py-1.5 rounded-xl font-bold flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span>الإدارة</span>
                </button>
                <button id="logoutBtn" onclick="logout()" class="hidden text-xs bg-gray-800 hover:bg-gray-700 text-gray-200 px-3 py-1.5 rounded-xl font-bold transition">خروج</button>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="max-w-xl w-full mx-auto p-3 flex-1">
        
        <!-- Login Card -->
        <div id="authScreen" class="glass-card rounded-3xl p-6 my-10 max-w-sm mx-auto space-y-5 text-center">
            <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-2xl text-white shadow-lg">
                <i class="fa-solid fa-user-astronaut"></i>
            </div>

            <div class="space-y-1">
                <h2 class="text-xl font-black text-white">تسجيل الدخول</h2>
                <p class="text-xs text-gray-400">منصة مشاركة الأكواد والمشاريع البرمجية</p>
            </div>

            <div class="space-y-3.5 text-right">
                <div>
                    <label class="text-[11px] text-gray-300 font-bold mb-1 block mr-1">اسم المستخدم</label>
                    <input type="text" id="usernameInput" placeholder="ادخل اسمك..." class="w-full input-style rounded-xl px-3.5 py-2.5 text-xs">
                </div>
                <div>
                    <label class="text-[11px] text-gray-300 font-bold mb-1 block mr-1">كلمة المرور</label>
                    <input type="password" id="passwordInput" placeholder="******" class="w-full input-style rounded-xl px-3.5 py-2.5 text-xs">
                </div>

                <div class="flex items-center gap-2 pt-1 mr-1">
                    <input type="checkbox" id="rememberMe" class="rounded accent-blue-500 w-4 h-4 cursor-pointer">
                    <label for="rememberMe" class="text-xs text-gray-300 cursor-pointer font-bold">تذكرني على هذا الجهاز</label>
                </div>

                <button onclick="loginUser()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-black py-3 rounded-xl text-xs shadow-lg transition transform active:scale-95">
                    دخول المنصة 🚀
                </button>
            </div>
        </div>

        <!-- Dashboard Content -->
        <div id="appContent" class="hidden space-y-4">
            
            <!-- Profile Info Header -->
            <div class="glass-card rounded-2xl p-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <img id="userAvatarHeader" src="" class="w-12 h-12 rounded-full object-cover border-2 border-blue-500/50 shadow-md">
                    <div>
                        <div class="flex items-center gap-1.5">
                            <h3 id="userNameHeader" class="font-black text-sm text-white"></h3>
                            <span id="userBadgeHeader"></span>
                        </div>
                        <p id="userBioHeader" class="text-[11px] text-gray-400 leading-tight mt-0.5"></p>
                    </div>
                </div>
                <button onclick="openProfileModal()" class="text-xs bg-blue-600/20 hover:bg-blue-600/40 text-blue-400 border border-blue-500/30 px-3 py-1.5 rounded-xl font-bold flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-user-pen"></i>
                    <span>تعديل</span>
                </button>
            </div>

            <!-- New Post Publisher -->
            <div class="glass-card rounded-2xl p-4 space-y-3">
                <span class="text-xs font-bold text-gray-300 flex items-center gap-1.5">
                    <i class="fa-solid fa-code text-blue-400"></i> نشر كود أو اسكريبت جديد:
                </span>
                <input type="text" id="postTitle" placeholder="عنوان الكود (مثال: اسكريبت بوت واتساب)" class="w-full input-style rounded-xl p-2.5 text-xs">
                <textarea id="postCode" rows="3" placeholder="ضع الكود هنا..." class="w-full input-style rounded-xl p-2.5 text-xs font-mono"></textarea>
                <button onclick="publishPost()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-md">
                    نشر الكود
                </button>
            </div>

            <!-- Posts Feed -->
            <div id="postsFeed" class="space-y-3"></div>
        </div>

    </main>

    <!-- Settings Modal (الإعدادات والخصوصية والتحكم بفيديو الخلفية) -->
    <div id="settingsModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div class="glass-card rounded-3xl p-5 max-w-sm w-full space-y-4">
            <div class="flex justify-between items-center border-b border-white/10 pb-2">
                <h3 class="text-sm font-black text-white flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-blue-400"></i> الإعدادات والخصوصية
                </h3>
                <button onclick="closeSettingsModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- Theme Mode Toggle -->
            <div class="space-y-2">
                <label class="text-xs font-bold text-gray-300 block">مظهر التطبيق</label>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="setTheme('dark')" id="darkThemeBtn" class="bg-blue-600 text-white py-2 rounded-xl text-xs font-bold border border-blue-500 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-moon"></i> الوضع الداكن
                    </button>
                    <button onclick="setTheme('light')" id="lightThemeBtn" class="bg-gray-800 text-gray-300 py-2 rounded-xl text-xs font-bold border border-white/10 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-sun text-amber-400"></i> الوضع الفاتح
                    </button>
                </div>
            </div>

            <!-- Video Background Switch -->
            <div class="space-y-2 pt-2 border-t border-white/10">
                <label class="text-xs font-bold text-gray-300 block">خلفية التطبيق</label>
                <label class="flex items-center justify-between p-2.5 rounded-xl bg-black/30 border border-white/5 cursor-pointer">
                    <span class="text-xs text-gray-200 font-bold flex items-center gap-2">
                        <i class="fa-solid fa-film text-purple-400"></i> تفعيل فيديو الخلفية المتحرك
                    </span>
                    <input type="checkbox" id="videoBgToggle" onchange="toggleVideoBackground()" class="accent-blue-500 w-4 h-4 cursor-pointer">
                </label>
            </div>

            <!-- Privacy Controls -->
            <div class="space-y-2 pt-2 border-t border-white/10">
                <label class="text-xs font-bold text-gray-300 block">إعدادات الخصوصية</label>
                <div class="space-y-2 text-xs text-gray-300">
                    <label class="flex items-center justify-between p-2 rounded-xl bg-black/20">
                        <span>إظهار النبذة التعريفية للجميع</span>
                        <input type="checkbox" id="showBioToggle" checked onchange="togglePrivacySetting('showBio')" class="accent-blue-500 w-4 h-4">
                    </label>
                    <label class="flex items-center justify-between p-2 rounded-xl bg-black/20">
                        <span>إغلاق الحساب (خاص)</span>
                        <input type="checkbox" id="privateAccountToggle" onchange="togglePrivacySetting('isPrivate')" class="accent-blue-500 w-4 h-4">
                    </label>
                </div>
            </div>

            <button onclick="closeSettingsModal()" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-xl text-xs font-bold">
                حفظ وإغلاق
            </button>
        </div>
    </div>

    <!-- Profile Edit Modal -->
    <div id="profileModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div class="glass-card rounded-3xl p-5 max-w-sm w-full space-y-4">
            <h3 class="text-sm font-black text-white text-center">تعديل الملف الشخصي</h3>
            
            <div class="space-y-3">
                <div>
                    <label class="text-[11px] text-gray-300 font-bold mb-1 block">رابط صورة البروفايل (URL)</label>
                    <input type="text" id="editAvatarInput" class="w-full input-style rounded-xl p-2.5 text-xs">
                </div>
                <div>
                    <label class="text-[11px] text-gray-300 font-bold mb-1 block">النبذة التعريفية (Bio)</label>
                    <textarea id="editBioInput" rows="2" class="w-full input-style rounded-xl p-2.5 text-xs"></textarea>
                </div>
            </div>

            <div class="flex gap-2">
                <button onclick="closeProfileModal()" class="w-1/2 bg-gray-800 text-gray-300 py-2.5 rounded-xl text-xs font-bold">إلغاء</button>
                <button onclick="saveProfile()" class="w-1/2 bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-xl text-xs font-bold">حفظ التغييرات</button>
            </div>
        </div>
    </div>

    <!-- Dev Auth Modal -->
    <div id="devAuthModal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div class="glass-card rounded-3xl p-5 max-w-xs w-full text-center space-y-3 border-red-500/40">
            <i class="fa-solid fa-shield-halved text-red-500 text-3xl"></i>
            <h3 class="text-xs font-bold text-white">منطقة الوصول الخاص</h3>
            <input type="password" id="devKeyInput" placeholder="أدخل كود الوصول السرّي" class="w-full input-style text-center font-mono text-red-400 rounded-xl p-2.5 text-xs uppercase">
            <div class="flex gap-2">
                <button onclick="closeDevAuth()" class="w-1/2 bg-gray-800 text-gray-300 py-2 rounded-xl text-xs font-bold">إلغاء</button>
                <button onclick="verifyDev()" class="w-1/2 bg-red-600 hover:bg-red-500 text-white py-2 rounded-xl text-xs font-bold">تأكيد</button>
            </div>
        </div>
    </div>

    <!-- Developer Control Center -->
    <div id="devDashboard" class="hidden fixed inset-0 bg-black/90 backdrop-blur-xl flex items-center justify-center p-4 z-50 overflow-hidden">
        <video class="dev-video-bg" autoplay loop muted playsinline>
            <source src="https://files.catbox.moe/dglmga.mp4" type="video/mp4">
        </video>

        <div class="glass-card relative z-10 rounded-3xl p-4 max-w-lg w-full h-[82vh] flex flex-col space-y-3 border-red-500/50 shadow-2xl">
            <div class="flex justify-between items-center border-b border-white/10 pb-2">
                <span class="text-xs font-bold text-red-400 flex items-center gap-1.5">
                    <i class="fa-solid fa-user-shield animate-pulse"></i> لوحة التحكم والإدارة العامة
                </span>
                <button onclick="closeDevDash()" class="text-gray-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div id="devUsersList" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>
        </div>
    </div>

    <!-- JS Logic -->
    <script>
        let users = JSON.parse(localStorage.getItem('taeha_v5_users') || "{}");
        let posts = JSON.parse(localStorage.getItem('taeha_v5_posts') || "[]");
        let bannedUsers = JSON.parse(localStorage.getItem('taeha_v5_banned') || "[]");
        let settings = JSON.parse(localStorage.getItem('taeha_v5_settings') || '{"theme":"dark","showBio":true,"isPrivate":false,"enableVideoBg":false}');
        let currentUser = null;

        window.addEventListener('DOMContentLoaded', () => {
            applyTheme(settings.theme);
            applyVideoBg(settings.enableVideoBg);

            const remembered = localStorage.getItem('taeha_remembered_user');
            if (remembered && users[remembered] && !bannedUsers.includes(remembered)) {
                autoLogin(remembered);
            }
        });

        function loginUser() {
            const user = document.getElementById('usernameInput').value.trim();
            const rememberMe = document.getElementById('rememberMe').checked;

            if (!user) return alert('يرجى إدخال اسم المستخدم!');
            if (bannedUsers.includes(user)) return alert('⚠️ هذا الحساب مطرود من قِبل الإدارة!');

            if (!users[user]) {
                users[user] = {
                    isVerified: false,
                    avatar: 'https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=200&auto=format&fit=crop',
                    bio: 'مطور برمجيات في Taeha Panel'
                };
                saveData();
            }

            if (rememberMe) {
                localStorage.setItem('taeha_remembered_user', user);
            } else {
                localStorage.removeItem('taeha_remembered_user');
            }

            autoLogin(user);
        }

        function autoLogin(username) {
            currentUser = username;
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('appContent').classList.remove('hidden');
            document.getElementById('logoutBtn').classList.remove('hidden');

            updateProfileHeader();
            renderPosts();
        }

        function logout() {
            localStorage.removeItem('taeha_remembered_user');
            location.reload();
        }

        function updateProfileHeader() {
            const u = users[currentUser];
            document.getElementById('userAvatarHeader').src = u.avatar;
            document.getElementById('userNameHeader').innerText = currentUser;
            document.getElementById('userBioHeader').innerText = settings.showBio ? u.bio : '';

            const badge = document.getElementById('userBadgeHeader');
            if (u.isVerified) {
                badge.innerHTML = `<i class="fa-solid fa-circle-check text-blue-400 text-xs" title="حساب موثق"></i>`;
            } else {
                badge.innerHTML = '';
            }
        }

        function publishPost() {
            const title = document.getElementById('postTitle').value.trim();
            const code = document.getElementById('postCode').value.trim();

            if (!title || !code) return alert('يرجى كتابة العنوان والكود!');

            posts.unshift({
                id: Date.now(),
                author: currentUser,
                title: title,
                code: code,
                date: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })
            });

            document.getElementById('postTitle').value = '';
            document.getElementById('postCode').value = '';

            saveData();
            renderPosts();
        }

        function renderPosts() {
            const feed = document.getElementById('postsFeed');
            if (posts.length === 0) {
                feed.innerHTML = `<p class="text-center text-gray-500 text-xs py-6">لا توجد منشورات بعد...</p>`;
                return;
            }

            feed.innerHTML = posts.map(p => {
                const u = users[p.author] || {};
                return `
                    <div class="glass-card rounded-2xl p-4 space-y-2.5">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-2.5">
                                <img src="${u.avatar || ''}" class="w-8 h-8 rounded-full object-cover">
                                <div>
                                    <div class="flex items-center gap-1">
                                        <span class="text-xs font-bold text-white">${p.author}</span>
                                        ${u.isVerified ? '<i class="fa-solid fa-circle-check text-blue-400 text-[11px]"></i>' : ''}
                                    </div>
                                    <span class="text-[10px] text-gray-400">${p.date}</span>
                                </div>
                            </div>
                            <button onclick="copyCode(this)" class="text-[11px] bg-blue-600/20 hover:bg-blue-600 text-blue-300 hover:text-white px-2.5 py-1 rounded-lg border border-blue-500/30 font-bold transition">
                                <i class="fa-regular fa-copy ml-1"></i>نسخ
                            </button>
                        </div>
                        <h4 class="text-xs font-bold text-blue-400">${p.title}</h4>
                        <pre class="bg-black/70 p-3 rounded-xl font-mono text-xs text-emerald-400 overflow-x-auto border border-white/10">${escapeHtml(p.code)}</pre>
                    </div>
                `;
            }).join('');
        }

        function copyCode(btn) {
            const code = btn.parentElement.nextElementSibling.nextElementSibling.innerText;
            navigator.clipboard.writeText(code);
            btn.innerHTML = `<i class="fa-solid fa-check ml-1 text-emerald-400"></i>تم النسخ`;
            setTimeout(() => {
                btn.innerHTML = `<i class="fa-regular fa-copy ml-1"></i>نسخ`;
            }, 2000);
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
        // Settings Modal, Theme & Video BG Switcher
        function openSettingsModal() {
            document.getElementById('settingsModal').classList.remove('hidden');
            document.getElementById('showBioToggle').checked = settings.showBio;
            document.getElementById('privateAccountToggle').checked = settings.isPrivate;
            document.getElementById('videoBgToggle').checked = settings.enableVideoBg;
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function toggleVideoBackground() {
            const enabled = document.getElementById('videoBgToggle').checked;
            settings.enableVideoBg = enabled;
            saveData();
            applyVideoBg(enabled);
        }

        function applyVideoBg(enabled) {
            const videoElem = document.getElementById('bgGlobalVideo');
            if (enabled) {
                videoElem.classList.remove('hidden');
            } else {
                videoElem.classList.add('hidden');
            }
        }

        function setTheme(mode) {
            settings.theme = mode;
            saveData();
            applyTheme(mode);
        }

        function applyTheme(mode) {
            if (mode === 'light') {
                document.body.classList.remove('dark-mode');
                document.body.classList.add('light-mode');
            } else {
                document.body.classList.remove('light-mode');
                document.body.classList.add('dark-mode');
            }
        }

        function togglePrivacySetting(key) {
            if (key === 'showBio') settings.showBio = document.getElementById('showBioToggle').checked;
            if (key === 'isPrivate') settings.isPrivate = document.getElementById('privateAccountToggle').checked;
            saveData();
            if (currentUser) updateProfileHeader();
        }

        // Profile Modal
        function openProfileModal() {
            document.getElementById('profileModal').classList.remove('hidden');
            document.getElementById('editAvatarInput').value = users[currentUser].avatar;
            document.getElementById('editBioInput').value = users[currentUser].bio;
        }

        function closeProfileModal() {
            document.getElementById('profileModal').classList.add('hidden');
        }

        function saveProfile() {
            const avatar = document.getElementById('editAvatarInput').value.trim();
            const bio = document.getElementById('editBioInput').value.trim();

            if (avatar) users[currentUser].avatar = avatar;
            if (bio) users[currentUser].bio = bio;

            saveData();
            updateProfileHeader();
            renderPosts();
            closeProfileModal();
        }
        // Dev Auth (كود سرّي مُشفر TAEHADEV)
        function openDevAuth() { document.getElementById('devAuthModal').classList.remove('hidden'); }
        function closeDevAuth() { document.getElementById('devAuthModal').classList.add('hidden'); }

        function verifyDev() {
            const input = document.getElementById('devKeyInput').value.trim();
            if (btoa(input) === "VEFFSEFERVY=") {
                closeDevAuth();
                openDevDash();
            } else {
                alert('كود الوصول غير صحيح!');
            }
        }

        function openDevDash() {
            document.getElementById('devDashboard').classList.remove('hidden');
            renderDevUsers();
        }

        function closeDevDash() { document.getElementById('devDashboard').classList.add('hidden'); }

        function toggleVerify(username) {
            users[username].isVerified = !users[username].isVerified;
            saveData();
            renderDevUsers();
            if (currentUser === username) updateProfileHeader();
            renderPosts();
        }

        function kickUser(username) {
            if (confirm(`طرد الحساب "${username}"؟`)) {
                bannedUsers.push(username);
                saveData();
                renderDevUsers();
                if (currentUser === username) logout();
            }
        }

        function renderDevUsers() {
            const container = document.getElementById('devUsersList');
            const list = Object.keys(users);

            container.innerHTML = list.map(u => `
                <div class="glass-card p-2.5 rounded-xl flex items-center justify-between text-xs border-white/10">
                    <div class="flex items-center gap-2">
                        <img src="${users[u].avatar}" class="w-7 h-7 rounded-full object-cover">
                        <span class="font-bold text-white">${u}</span>
                        ${users[u].isVerified ? '<i class="fa-solid fa-circle-check text-blue-400"></i>' : ''}
                    </div>
                    <div class="flex gap-1.5">
                        <button onclick="toggleVerify('${u}')" class="bg-blue-600/20 text-blue-400 hover:bg-blue-600 hover:text-white px-2 py-1 rounded-lg text-[11px] font-bold border border-blue-500/30">
                            ${users[u].isVerified ? 'إزالة التوثيق' : 'توثيق 💙'}
                        </button>
                        <button onclick="kickUser('${u}')" class="bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white px-2 py-1 rounded-lg text-[11px] font-bold border border-red-500/30">
                            طرد
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function saveData() {
            localStorage.setItem('taeha_v5_users', JSON.stringify(users));
            localStorage.setItem('taeha_v5_posts', JSON.stringify(posts));
            localStorage.setItem('taeha_v5_banned', JSON.stringify(bannedUsers));
            localStorage.setItem('taeha_v5_settings', JSON.stringify(settings));
        }
    </script>
</body>
</html>
